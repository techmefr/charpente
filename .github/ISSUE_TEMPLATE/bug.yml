name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you got
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal config and markup, or a link to a repository
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Charpente package, framework, bundler and browser
    validations:
      required: false
